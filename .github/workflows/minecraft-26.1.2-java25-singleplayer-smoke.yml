name: Split existing public runtime for offline tests
on:
  push:
    branches: [ci/java25-singleplayer-smoke-20261016]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  split-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve already downloaded public runtime
        uses: actions/download-artifact@v5
        with:
          name: public-runtime-offline
          run-id: 38855492683
          github-token: ${{ github.token }}
          path: parts
      - name: Verify parts
        shell: bash
        run: sha256sum -c parts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-part-00
          path: parts/public-runtime.tar.gz.part-00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-part-01
          path: parts/public-runtime.tar.gz.part-01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-part-02
          path: parts/public-runtime.tar.gz.part-02
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: public-runtime-part-03
          path: parts/public-runtime.tar.gz.part-03
          compression-level: 0
          retention-days: 1
      - name: Remove only the superseded combined artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE repos/fxjcangku/26.1.2/actions/artifacts/12026772049
