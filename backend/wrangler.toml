# Cloudflare Workers 配置文件
name = "yiyiaddon-stats"
main = "worker.js"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "yiyiaddon-users"
database_id = "1a932013-be80-43f4-ae86-12b62ead7a0a"

# 环境变量（管理员密钥，用于查看用户列表）
[vars]
ADMIN_KEY = "your-secret-admin-key-here"
