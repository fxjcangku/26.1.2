<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yiyiaddon 用户管理后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-0: #05070C;
            --bg-1: #0A0D12;
            --bg-2: #0F131C;
            --bg-3: #161D2B;
            --bg-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #0E7490;
            --text: #E2E8F0;
            --text-dim: #94A3B8;
            --success: #6EE7B7;
            --danger: #F87171;
            --warning: #FBBF24;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        .container {
            max-width: clamp(320px, 90vw, 1400px);
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
            position: relative;
            z-index: 1;
        }
        
        header {
            background: var(--bg-2);
            padding: clamp(1.5rem, 4vw, 2.5rem) 0;
            border-radius: 999px;
            margin-bottom: clamp(1.5rem, 4vw, 3rem);
            text-align: center;
        }
        
        h1 {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--accent), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            color: var(--text-dim);
            font-size: clamp(0.875rem, 2.5vw, 1rem);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(clamp(200px, 25vw, 280px), 1fr));
            gap: clamp(1rem, 2vw, 1.5rem);
            margin-bottom: clamp(1.5rem, 3vw, 2.5rem);
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            border: 1px solid var(--bg-3);
            border-radius: 16px;
            padding: clamp(1.25rem, 3vw, 1.75rem);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 48px rgba(56, 189, 248, 0.15);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-label {
            color: var(--text-dim);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9375rem;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            color: var(--bg-0);
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.4);
        }
        
        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 0.75rem 1.5rem;
            border-radius: 999px;
            border: 1px solid var(--bg-3);
            background: var(--bg-2);
            color: var(--text);
            font-size: 0.9375rem;
        }
        
        .search-box:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .table-container {
            background: var(--bg-1);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--bg-3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: clamp(0.8125rem, 1.8vw, 0.9375rem);
        }
        
        thead {
            background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-3) 100%);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: clamp(0.875rem, 2vw, 1.25rem);
            text-align: left;
            font-weight: 600;
            color: var(--accent);
            font-size: 0.875rem;
            letter-spacing: 0.025em;
            border-bottom: 2px solid var(--bg-3);
            white-space: nowrap;
        }
        
        td {
            padding: clamp(0.75rem, 1.8vw, 1rem);
            border-top: 1px solid var(--bg-3);
            font-size: 0.9375rem;
        }
        
        tbody tr {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        tbody tr:hover {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.05) 0%, transparent 100%);
            transform: translateX(4px);
        }
        
        .badge {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 999px;
            font-size: 0.8125rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .badge-online {
            background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(34, 197, 94, 0.1) 100%);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.2);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .badge-offline {
            background: rgba(107, 114, 128, 0.15);
            color: var(--text-dim);
            border: 1px solid rgba(107, 114, 128, 0.2);
        }
        
        .badge-premium {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2) 0%, rgba(251, 191, 36, 0.1) 100%);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.2);
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-dim);
        }
        
        .error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 1rem;
            border-radius: 16px;
            margin-bottom: 2rem;
        }
        
        .flag {
            font-size: 1.25rem;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .table-container {
                overflow-x: auto;
            }
            
            table {
                min-width: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Yiyiaddon 用户管理后台</h1>
            <p class="subtitle">实时监控玩家数据 · Cloudflare Workers 驱动</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">累计用户</div>
                <div class="stat-value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">累计进入次数</div>
                <div class="stat-value" id="totalUses">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">24h 活跃</div>
                <div class="stat-value" id="activeUsers">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">在线玩家</div>
                <div class="stat-value" id="onlineUsers">0</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="loadData()">🔄 刷新数据</button>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索玩家名称、UUID、IP..." onkeyup="filterTable()">
        </div>
        
        <div id="errorContainer"></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>玩家名称</th>
                        <th>UUID</th>
                        <th>正版</th>
                        <th>版本</th>
                        <th>MC版本</th>
                        <th>客户端IP</th>
                        <th>国家</th>
                        <th>服务器IP</th>
                        <th>服务器名称</th>
                        <th>最后上线</th>
                        <th>使用次数</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="13" class="loading">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const API_URL = 'https://yiyiaddon-stats.fxjggyx.workers.dev/api/stats';
        
        let allUsers = [];
        
        async function loadData() {
            try {
                document.getElementById('errorContainer').innerHTML = '';
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="13" class="loading">加载中...</td></tr>';
                
                const response = await fetch(API_URL + '?t=' + Date.now());
                if (!response.ok) throw new Error('HTTP ' + response.status);
                
                const data = await response.json();
                
                // 更新统计卡片
                document.getElementById('totalUsers').textContent = data.total_users || 0;
                document.getElementById('totalUses').textContent = data.total_uses || 0;
                document.getElementById('activeUsers').textContent = data.active_users_24h || 0;
                
                // 计算在线玩家（5分钟内活跃）
                const now = Date.now();
                const onlineCount = (data.recent_users || []).filter(u => 
                    (now - u.last_seen * 1000) < 300000
                ).length;
                document.getElementById('onlineUsers').textContent = onlineCount;
                
                // 保存所有用户数据
                allUsers = data.recent_users || [];
                
                // 渲染表格
                renderTable(allUsers);
                
            } catch (error) {
                document.getElementById('errorContainer').innerHTML = `
                    <div class="error">❌ 加载失败: ${error.message}</div>
                `;
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="13" class="loading">加载失败</td></tr>';
            }
        }
        
        function renderTable(users) {
            const tbody = document.getElementById('tableBody');
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="13" class="loading">暂无数据</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.map((user, index) => {
                const now = Date.now();
                const fiveMinutes = 5 * 60 * 1000;
                const isOnline = (now - user.last_seen) < fiveMinutes;
                const statusBadge = isOnline 
                    ? '<span class="badge badge-online">● 在线</span>'
                    : '<span class="badge badge-offline">○ 离线</span>';
                
                const timeAgo = formatTimeAgo(user.last_seen);
                const timeDisplay = `<span title="${new Date(user.last_seen).toLocaleString('zh-CN')}">${timeAgo}</span>`;
                
                const flag = user.client_country ? countryCodeToFlag(user.client_country) : '🌐';
                const country = user.client_country || '未知';
                const clientIp = user.client_ip || '未知';
                const serverIp = user.server_ip || '未知';
                const serverName = user.server_name || '未知';
                const isPremium = user.is_premium ? '<span class="badge badge-premium">✓ 正版</span>' : '<span class="badge badge-offline">离线版</span>';
                
                return `
                    <tr>
                        <td>#${index + 1}</td>
                        <td><strong>${escapeHtml(user.name)}</strong></td>
                        <td style="font-family: monospace; font-size: 0.75rem; color: var(--text-dim);" title="${escapeHtml(user.uuid)}">${escapeHtml(user.uuid).substring(0, 8)}...</td>
                        <td>${isPremium}</td>
                        <td>${escapeHtml(user.version)}</td>
                        <td>${escapeHtml(user.minecraft_version || 'N/A')}</td>
                        <td style="font-family: monospace;">${escapeHtml(clientIp)}</td>
                        <td><span class="flag">${flag}</span>${country}</td>
                        <td style="font-family: monospace; color: var(--accent);">${escapeHtml(serverIp)}</td>
                        <td style="color: var(--success);">${escapeHtml(serverName)}</td>
                        <td>${timeDisplay}</td>
                        <td>${user.usage_count || 1}</td>
                        <td>${statusBadge}</td>
                    </tr>
                `;
            }).join('');
        }
        
        function filterTable() {
            const searchText = document.getElementById('searchBox').value.toLowerCase();
            
            if (!searchText) {
                renderTable(allUsers);
                return;
            }
            
            const filtered = allUsers.filter(user => 
                user.name.toLowerCase().includes(searchText) ||
                user.uuid.toLowerCase().includes(searchText) ||
                (user.client_ip && user.client_ip.toLowerCase().includes(searchText)) ||
                (user.client_country && user.client_country.toLowerCase().includes(searchText)) ||
                (user.server_ip && user.server_ip.toLowerCase().includes(searchText)) ||
                (user.server_name && user.server_name.toLowerCase().includes(searchText))
            );
            
            renderTable(filtered);
        }
        
        function formatTimeAgo(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return '刚刚';
            if (minutes < 60) return `${minutes} 分钟前`;
            if (hours < 24) return `${hours} 小时前`;
            return `${days} 天前`;
        }
        
        function countryCodeToFlag(code) {
            if (!code || code.length !== 2) return '🌐';
            const codePoints = code
                .toUpperCase()
                .split('')
                .map(char => 127397 + char.charCodeAt(0));
            return String.fromCodePoint(...codePoints);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 自动刷新（每30秒）
        setInterval(loadData, 30000);
        
        // 页面加载时获取数据
        loadData();
    </script>
</body>
</html>
